name: Build bootloader

on:
  push:
    branches:
      - main
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install compiler
        run: |
          sudo apt update
          sudo apt install -y \
            libnewlib-arm-none-eabi \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build bootloader
        run: |
          ./releng/build_bootloader.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootloader.bin
          path: build/amalgamation.bin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootloader.hex
          path: build/amalgamation.hex

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/release-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/amalgamation.bin#bootloader.bin \
            build/amalgamation.hex#bootloader.hex \
            --title "${GITHUB_REF_NAME#release-}" \
            --generate-notes
